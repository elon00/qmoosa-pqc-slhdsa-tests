name: Full-Spectrum Post-Quantum Reality Gates & Invariant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  reality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repository
        uses: actions/checkout@v4
        with:
          path: qmoosa-pqc-slhdsa-tests

      - name: Checkout protocol repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-slhdsa-protocol
          ref: 75784c7a219acce053b00d4e0d483182573af374
          path: qmoosa-pqc-slhdsa-protocol

      - name: Checkout engine repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-slhdsa-engine
          ref: 41f8afa3a32af2a03e004c340e12ed77085488f5
          path: qmoosa-pqc-slhdsa-engine

      - name: Checkout sdk repository (Pinned Commit)
        uses: actions/checkout@v4
        with:
          repository: elon00/qmoosa-pqc-slhdsa-sdk
          ref: 0b7aa112881c83c68b1b0a80303a35d17894facd
          path: qmoosa-pqc-slhdsa-sdk

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies in sibling repositories
        run: |
          npm install --prefix qmoosa-pqc-slhdsa-protocol
          npm install --prefix qmoosa-pqc-slhdsa-engine
          npm install --prefix qmoosa-pqc-slhdsa-sdk

      - name: Install dependencies in tests repository
        working-directory: qmoosa-pqc-slhdsa-tests
        run: |
          rm -f package-lock.json
          npm install --no-package-lock
          mkdir -p node_modules/@qmoosa/pqc-slhdsa-protocol
          mkdir -p node_modules/@qmoosa/pqc-slhdsa-engine
          mkdir -p node_modules/@qmoosa/pqc-slhdsa-sdk
          tar -xzf packages/qmoosa-pqc-slhdsa-protocol-1.0.0.tgz -C node_modules/@qmoosa/pqc-slhdsa-protocol --strip-components=1
          tar -xzf packages/qmoosa-pqc-slhdsa-engine-1.0.0.tgz -C node_modules/@qmoosa/pqc-slhdsa-engine --strip-components=1
          tar -xzf packages/qmoosa-pqc-slhdsa-sdk-1.0.0.tgz -C node_modules/@qmoosa/pqc-slhdsa-sdk --strip-components=1

      - name: Run Source & Package Integrity Gate (Archive Mode)
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run verify:archive

      - name: Run Strict Current-HEAD Alignment Gate
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run verify:current-head

      - name: Run Hermetic Source Derivation & Canonical Artifact Comparison Gate
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run verify:source

      - name: Run Integration Tests
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run test:integration

      - name: Run Adversarial Negative Control Suite
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run test:negative

      - name: Static Lint Check
        working-directory: qmoosa-pqc-slhdsa-tests
        run: npm run lint
